services:
  db:
    ports:
      - "5432:5432"

  app:
    command: ["sh", "-c", "./prestart.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.venv

  promtail:
    volumes:
      - ./logs:/app/logs:ro

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "if [ ! -f node_modules/.package-lock.json ]; then npm ci --fetch-retries=5 --fetch-retry-maxtimeout=120000; fi && npm run dev"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_TARGET=http://app:8000
    depends_on:
      - app
