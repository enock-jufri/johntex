groups:
  - name: payroll_alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5xx"}[5m]))
          / clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate"
          description: "5xx error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_highr_seconds_bucket[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency"
          description: "P95 latency is {{ $value }}s over the last 5 minutes."

      - alert: AppDown
        expr: up{job="payroll-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "App is down"
          description: "The payroll app at {{ $labels.instance }} has been unreachable for over 1 minute."

      - alert: MpesaPaymentFailures
        expr: rate(payroll_payment_attempts_total{status="failed"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "M-Pesa payment failures detected"
          description: "M-Pesa B2C payments are failing. Check M-Pesa credentials and Safaricom API status."

      - alert: MpesaOrphanCallbacks
        expr: rate(payroll_mpesa_callbacks_total{outcome="orphan"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Orphan M-Pesa callbacks"
          description: "M-Pesa callbacks arriving with no matching transaction. Possible configuration mismatch."

      - alert: AuthFailureSpike
        expr: |
          sum(rate(payroll_auth_attempts_total{result="failure"}[10m]))
          / clamp_min(sum(rate(payroll_auth_attempts_total[10m])), 0.001)
          > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High auth failure rate"
          description: "Auth failure rate is {{ $value | humanizePercentage }} over the last 10 minutes. Possible brute force attempt."

      - alert: PayrollStuckProcessing
        expr: payroll_payment_duration_seconds_count > 0 and rate(payroll_payment_duration_seconds_count[1h]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Payroll payments may be stuck"
          description: "No M-Pesa payment activity in the last hour despite previous payments. Callbacks may be stuck."

      - alert: NoMetrics
        expr: absent(up{job="payroll-app"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No metrics from payroll app"
          description: "Prometheus is not receiving any metrics from the payroll app. The /metrics endpoint may be down."
