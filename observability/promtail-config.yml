server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: payroll-app
    static_configs:
      - targets: []
        labels:
          job: payroll
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            request_id: request_id
            method: method
            path: path
            status_code: status_code
            duration_ms: duration_ms
      - labels:
          level:
          logger:
