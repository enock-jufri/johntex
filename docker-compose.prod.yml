services:
  app:
    command: ["sh", "-c", "./prestart.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"]
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - app_logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  app_logs:
